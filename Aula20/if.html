<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDICIONAIS</title>
</head>
<body>
    <h1>USANDO O IF</h1>
    <p>Quantos dolares tem o Aser</p>

    <input type="number" name="ef" id="ef">

    <input type="button" value="verificar" onclick="verificar()" id="bt">
    <div id="d1">É RICO OU POBRE</div>

    <script>
        function verificar(){

            var n1=window.document.getElementById('ef')
            var n= Number(n1.value)
            var d1=window.document.getElementById('d1')
            if(n>500){
                d1.innerHTML= `O SEU CAPITAL É DE ${n} DOLARES, VOCÊ É RICO.`
            }
            else if(n>=100){
                d1.innerHTML= `O SEU CAPITAL É DE ${n} DOLARES, VOCÊ É POBRE`
            }
            else{
                d1.innerHTML= `O SEU CAPITAL É DE ${n} DOLARES, VOCÊ É MUITO, MUITO POBRE`
            }
        }
    </script>
</body>
</html>
