<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVA 1</title>
    <link rel="stylesheet" href="server.js">

</head>
<body>
    <h1>ESTUDANDO JAVA</h1>

    <script>
        p=window.prompt(`Qual é o seu nome?`)
        
        a=window.prompt(`Onde você mora?`)
        e=window.prompt(`Que idade tem`)
        window.alert(`O seu nome é ${p}, Tens ${e}, Você mora em ${a}`)

        h1=parseInt((`O primeiro numero é 1`))
        h2=parseInt((`O segundo numero é 2`))
        *s=h1+h2
        window.alert('O resultado é ${*s}')
    </script>
</body>
</html>
