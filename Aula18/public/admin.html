<!DOCTYPE html>

<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel - AutoVenda</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <h1>
        🚘 AutoVenda
    </h1>

    <button onclick="sair()">
        Sair
    </button>

</header>


<main>

    <h1>
        Painel Administrativo
    </h1>


    <p>
        Bem-vindo ao painel de administração.
    </p>


    <hr>


    <h2>
        Adicionar veículo
    </h2>


    <form id="carForm">

        <label>
            Marca
        </label>

        <input
            type="text"
            id="marca"
            placeholder="Toyota"
            required
        >


        <label>
            Modelo
        </label>

        <input
            type="text"
            id="modelo"
            placeholder="Land Cruiser"
            required
        >


        <label>
            Ano
        </label>

        <input
            type="number"
            id="ano"
            placeholder="2024"
            required
        >


        <label>
            Preço
        </label>

        <input
            type="number"
            id="preco"
            placeholder="25000000"
            required
        >


        <button type="submit">
            Adicionar carro
        </button>

    </form>


    <h2>
        Carros cadastrados
    </h2>


    <div id="listaCarros"></div>

</main>


<script>

/*
 * VERIFICAR SE ESTÁ LOGADO
 */

const administrador =
    localStorage.getItem(
        "autovendaAdmin"
    );


if (administrador !== "true") {

    window.location.href =
        "login.html";

}


/*
 * SAIR
 */

function sair() {

    localStorage.removeItem(
        "autovendaAdmin"
    );

    window.location.href =
        "login.html";

}


/*
 * CARROS
 */

let carros =
    JSON.parse(
        localStorage.getItem(
            "autovendaCarros"
        )
    ) || [];


/*
 * MOSTRAR CARROS
 */

function mostrarCarros() {

    const lista =
        document.getElementById(
            "listaCarros"
        );


    lista.innerHTML = "";


    carros.forEach(
        function(carro, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.innerHTML = `

                <div class="car-admin">

                    <h3>
                        ${carro.marca}
                        ${carro.modelo}
                    </h3>

                    <p>
                        Ano:
                        ${carro.ano}
                    </p>

                    <p>
                        Preço:
                        ${carro.preco}
                        Kz
                    </p>

                    <button
                        onclick="eliminarCarro(${index})"
                    >
                        Eliminar
                    </button>

                </div>

            `;


            lista.appendChild(div);

        }
    );

}


/*
 * ADICIONAR CARRO
 */

document
    .getElementById("carForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const carro = {

                marca:
                    document.getElementById(
                        "marca"
                    ).value,

                modelo:
                    document.getElementById(
                        "modelo"
                    ).value,

                ano:
                    document.getElementById(
                        "ano"
                    ).value,

                preco:
                    document.getElementById(
                        "preco"
                    ).value

            };


            carros.push(carro);


            localStorage.setItem(
                "autovendaCarros",
                JSON.stringify(carros)
            );


            document
                .getElementById("carForm")
                .reset();


            mostrarCarros();

        }
    );


/*
 * ELIMINAR CARRO
 */

function eliminarCarro(index) {

    carros.splice(index, 1);


    localStorage.setItem(
        "autovendaCarros",
        JSON.stringify(carros)
    );


    mostrarCarros();

}


/*
 * INICIAR
 */

mostrarCarros();

</script>

</body>

</html>
