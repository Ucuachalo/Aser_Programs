<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIV & DOMt</title>

    <style>
        div{
            width: 300px;
            height: 300px;
            background-color: aqua;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="d1" onclick="clicar()" onmouseenter="entrar()" onmouseout="sair()">
        <p>Veja o que acontece</p>
    </div>
    
    <script>
        var a=window.document.getElementById('d1')
        function clicar(){
            a.innerText= 'FEITO'
            a.style.background = 'red'
        }
        function entrar(){
            a.innerText = 'Mouse entrou'
            a.style.background= 'yellow'
        }
        function sair(){
            a.style.background= 'blue'
        }
    </script>
</body>
</html>
