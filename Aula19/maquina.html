<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÁQUINA</title>
</head>
<body>
    <h1>CALCULADORA</h1>
    <p>DIGITE O PRIMEIRO NÚMERO</p>
    <input type="number" name="textn1" id="textn1">
    <P>DIGITE O SEGUNDO NÚMERO</P> 
    <input type="number" name="textn2" id="textn2">
    <P>ESCOLHA O CÁLCULO</P>
    <input type="button" value="SOMA" onclick="SOMA()">
    <input type="button" value="SUB" onclick="SUB()">
    <input type="button" value="MULT" onclick="MULT()">
    <input type="button" value="DIVI" onclick="DIVI()">


    <div id="res">RESULTADO</div>

    <script>
        function SOMA(){
            var tn1=window.document.getElementById('textn1')
            var tn2=window.document.getElementById('textn2')
            var res=window.document.getElementById('res')
            var n1= Number(tn1.value)
            var n2= Number(tn2.value)
            var S=n1+n2
            
            res.innerHTML=`${S}`
        }
        function SUB(){
            var tn1=window.document.getElementById('textn1')
            var tn2=window.document.getElementById('textn2')
            var res=window.document.getElementById('res')
            var n1= Number(tn1.value)
            var n2= Number(tn2.value)
            var s=n1-n2
            
            res.innerHTML=`${s}`
        }
        function MULT(){
            var tn1=window.document.getElementById('textn1')
            var tn2=window.document.getElementById('textn2')
            var res=window.document.getElementById('res')
            var n1= Number(tn1.value)
            var n2= Number(tn2.value)
            var m=n1*n2
            
            res.innerHTML=`${m}`
        }
        function DIVI(){
            var tn1=window.document.getElementById('textn1')
            var tn2=window.document.getElementById('textn2')
            var res=window.document.getElementById('res')
            var n1= Number(tn1.value)
            var n2= Number(tn2.value)
            var d=n1/n2
            
            res.innerHTML=`${d}`
        }
    </script>
</body>
</html>
