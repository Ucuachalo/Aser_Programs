<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM DO JS</title>
</head>
<body>
    <h1>VAMOS ESTUDAR O DOM</h1>

    <p>Como ê a ligação</p>
    <p>Clique aqui</p>

    <script>
        var e=window.document.body
        var z=window.document.getElementsByTagName('p')[0]
        window.document.write(z.innerText)
        z.style.color='white'
        e.style.background='red'        
    </script>
</body>
</html>
